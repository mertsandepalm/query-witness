[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "query-witness"
dynamic = ["version"]
description = "Find and replay small DuckDB query counterexamples"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.15"
dependencies = ["duckdb==1.5.5", "sqlglot==30.18.0"]
classifiers = [
    "Environment :: Console",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: Implementation :: CPython",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[project.scripts]
query-witness = "query_witness.cli:main"

[tool.hatch.version]
path = "query_witness/__init__.py"

[tool.hatch.build.targets.sdist]
only-include = [
    "query_witness", "tests", "examples", "scripts", "README.md", "CHANGELOG.md",
    "RELEASE.md", "release-validation.json", "LICENSE", "pyproject.toml", "AGENTS.md", ".gitignore",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
